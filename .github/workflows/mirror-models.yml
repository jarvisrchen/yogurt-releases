name: Mirror models (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download, verify, upload
        run: |
          set -euo pipefail
          while read -r name sha url; do
            echo "::group::$name"
            curl -fL --retry 5 --retry-all-errors -o "$name" "$url"
            echo "$sha  $name" | sha256sum -c -
            gh release upload models-v1 "$name" -R "$GITHUB_REPOSITORY" --clobber
            rm -f "$name"
            echo "::endgroup::"
          done <<'LIST'
          ggml-small.en.bin c6138d6d58ecc8322097e0f987c32f1be8bb0a18532a3f88f734d1bbf9c41e5d https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en.bin
          parakeet-tdt-0.6b-v3-int8-encoder.int8.onnx acfc2b4456377e15d04f0243af540b7fe7c992f8d898d751cf134c3a55fd2247 https://huggingface.co/csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8/resolve/2bda32ec70b097a55adaa07d9a7173915b43cc78/encoder.int8.onnx
          ggml-medium.en.bin cc37e93478338ec7700281a7ac30a10128929eb8f427dda2e865faa8f6da4356 https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-medium.en.bin
          ggml-large-v3-turbo.bin 1fc70f774d38eb169993ac391eea357ef47c88757ef72ee5943879b7e8e2bc69 https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo.bin
          LIST
